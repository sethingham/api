name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main, feature/docker-deploy]

env:
  SERVICE: portfolio-api
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}"
          docker build \
            -t "$IMAGE:${{ github.event.workflow_run.head_sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.event.workflow_run.head_sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
          env_vars: |
            APP_ENV=production
            APP_DEBUG=false
            LOG_CHANNEL=stderr
            APP_URL=https://api.iamseth.com
          secrets: |
            APP_KEY=portfolio-api-key:latest
